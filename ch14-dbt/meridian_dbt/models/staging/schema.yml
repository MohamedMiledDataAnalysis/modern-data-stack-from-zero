version: 2

models:
  - name: stg_orders
    description: Cleaned and typed orders from fact_orders
    columns:
      - name: order_id
        description: Unique order identifier
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
