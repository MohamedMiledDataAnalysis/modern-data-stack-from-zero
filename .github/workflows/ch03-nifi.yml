name: Chapter 3 - NiFi
on:
  workflow_dispatch:
  push:
    paths: ['ch03-nifi/**', '.github/workflows/ch03-nifi.yml', '.github/scripts/nifi_flow_test.py']
jobs:
  nifi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start NiFi 2.12.0 exactly as the book does
        run: |
          mkdir -p ~/meridian/nifi
          bash ch03-nifi/start_nifi.sh
      - name: Wait for the UI
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:8443/nifi/ || true)
            if [ "$code" = "200" ]; then echo "UI answered after $((i*5)) s"; break; fi
            sleep 5
          done
          echo "--- log lines mentioning start ---"
          docker logs nifi 2>&1 | grep -iE "started|UI is available|https://" | tail -10
          curl -sk -o /dev/null -w "UI HTTP %{http_code}\n" https://localhost:8443/nifi/
      - name: Build the book's flow through the REST API and run it
        run: |
          chmod 777 ~/meridian/nifi/drops ~/meridian/nifi/landed ~/meridian/nifi/quarantine
          pip install -q requests
          python .github/scripts/nifi_flow_test.py
