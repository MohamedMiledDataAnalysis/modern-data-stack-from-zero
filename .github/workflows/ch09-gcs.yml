name: Chapter 9 - Cloud Storage (emulator)
on:
  workflow_dispatch:
  push:
    paths: ['ch09-gcs/**', '.github/workflows/ch09-gcs.yml']
jobs:
  gcs:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: meridian_user, POSTGRES_PASSWORD: meridian2024, POSTGRES_DB: meridian_db}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -q psycopg2-binary SQLAlchemy==2.1.8 Faker==40.54.0 pandas==3.1.1 pyarrow==26.0.1 google-cloud-storage==3.17.1 openpyxl
      - run: python data/generate_meridian.py > /dev/null && cd ch02-files-apis-iot && python make_supplier_files.py
      - name: Start the emulator as the book does
        run: |
          cd ch09-gcs && bash start_emulator.sh
          sleep 5 && docker logs fake-gcs 2>&1 | tail -3
      - name: Lake
        run: cd ch09-gcs && python create_lake.py && python read_lake.py && python lifecycle.py
      - name: Exercises
        run: cd ch09-gcs && python solutions/exercises.py
