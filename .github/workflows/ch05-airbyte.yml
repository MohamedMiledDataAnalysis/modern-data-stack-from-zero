name: Chapter 5 - Airbyte
on:
  workflow_dispatch:
    inputs:
      manual_abctl:
        description: 'Skip the installer and test the manual install of the book'
        type: boolean
        default: false
  push:
    paths: ['ch05-airbyte/**', '.github/workflows/ch05-airbyte.yml']
jobs:
  airbyte:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian_user
          POSTGRES_PASSWORD: meridian2024
          POSTGRES_DB: meridian_db
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -q psycopg2-binary Faker==40.54.0 requests
      - name: Load Meridian
        run: python data/generate_meridian.py
      - name: Install abctl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The installer's request for the latest release sometimes fails for a moment;
          # the book tells the reader to run the same line again (Chapter 5, Step 1).
          for i in 1 2 3 4 5; do
            [ "${{ inputs.manual_abctl }}" = "true" ] && break
            curl -LsfS https://get.airbyte.com | bash - && break
            echo "attempt $i failed; retrying in 20 s"; sleep 20
          done
          # If the installer keeps failing, install abctl by hand, as the book's mistake box says
          if ! command -v abctl >/dev/null; then
            gh release download -R airbytehq/abctl --pattern '*linux-amd64.tar.gz' -D /tmp/abctl
            tar -xzf /tmp/abctl/abctl-*.tar.gz -C /tmp/abctl && sudo mv /tmp/abctl/abctl-*/abctl /usr/local/bin/
          fi
          abctl version
      - name: Install Airbyte locally (low-resource mode)
        run: abctl local install --low-resource-mode --chart-version 2.5.0 2>&1 | tail -25
      - name: Health
        run: |
          curl -s -o /dev/null -w "UI HTTP %{http_code}\n" http://localhost:8000/
          curl -s http://localhost:8000/api/v1/health; echo
      - name: Sync through the API
        run: |
          CID=$(abctl local credentials 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | awk '/Client-Id/{print $NF}')
          CSEC=$(abctl local credentials 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | awk '/Client-Secret/{print $NF}')
          GW=$(hostname -I | awk '{print $1}')
          echo "database host for Airbyte: runner IP"
          python ch05-airbyte/sync_via_api.py "$CID" "$CSEC" "$GW"
      - name: Check the destination
        run: |
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "\dt airbyte_raw.*"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT COUNT(*), COUNT(DISTINCT order_id), MAX(order_id) FROM airbyte_raw.fact_orders;"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT order_id, COUNT(*) FROM airbyte_raw.fact_orders GROUP BY order_id HAVING COUNT(*) > 1;"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT COUNT(*) FROM airbyte_raw.dim_product;"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "\d airbyte_raw.dim_product"

      - name: Exercises 2 and 3
        run: |
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT COUNT(*) FROM (SELECT DISTINCT ON (order_id) * FROM airbyte_raw.fact_orders ORDER BY order_id, _airbyte_extracted_at DESC) t;"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT COUNT(DISTINCT _airbyte_extracted_at) AS stamps, COUNT(DISTINCT date_trunc('minute', _airbyte_extracted_at)) AS minutes, COUNT(DISTINCT _airbyte_generation_id) AS generations FROM airbyte_raw.fact_orders;"
          PGPASSWORD=meridian2024 psql -h localhost -U meridian_user meridian_db -c "SELECT _airbyte_generation_id, COUNT(*) FROM airbyte_raw.fact_orders GROUP BY 1 ORDER BY 1;"
